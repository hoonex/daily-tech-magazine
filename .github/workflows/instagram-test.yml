name: Instagram connection test
on:
  workflow_dispatch:
    inputs:
      publish_current:
        description: 'Publish the current carousel after connection check'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm install
      - name: Render current carousel
        run: |
          npm run validate
          npm run render
          npm run verify-output
      - name: Commit public carousel files
        run: |
          git config user.name "daily-tech-instagram-test"
          git config user.email "daily-tech-instagram-test@users.noreply.github.com"
          git add public/output
          git diff --cached --quiet || git commit -m "render: prepare current Instagram test carousel"
          git push
      - name: Check Instagram connection
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST || 'graph.instagram.com' }}
        run: npm run instagram:check
      - name: Publish current carousel
        if: ${{ inputs.publish_current }}
        env:
          INSTAGRAM_AUTO_PUBLISH: 'true'
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST || 'graph.instagram.com' }}
        run: npm run publish
