name: Render and publish
on:
  push:
    branches: [main]
    paths:
      - 'content/**.json'
  schedule:
    # 07:20 Asia/Seoul = 22:20 UTC on the previous day.
    # This is the reliable fallback when a connector-authored content commit
    # does not emit a push-triggered workflow run.
    - cron: '20 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-tech-publish
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm install
      - run: npm run check
      - run: npm run validate
      - run: npm run render
      - name: Commit rendered carousel
        run: |
          git config user.name "daily-tech-renderer"
          git config user.email "daily-tech-renderer@users.noreply.github.com"
          git add public/output
          git diff --cached --quiet || git commit -m "render: carousel $(node -p \"require('./content/latest.json').date\")"
          git push
      - name: Publish Instagram carousel
        env:
          INSTAGRAM_AUTO_PUBLISH: ${{ vars.INSTAGRAM_AUTO_PUBLISH }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: npm run publish
      - name: Commit publication marker
        if: ${{ vars.INSTAGRAM_AUTO_PUBLISH == 'true' }}
        run: |
          git add state/instagram || true
          git diff --cached --quiet || git commit -m "state: record Instagram publication"
          git push
